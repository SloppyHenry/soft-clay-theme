<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Dark edition of the Soft Clay background. Generated by gen_softclay_themes.py from clay_bg.svg - edit that one. -->
  <defs>
    <radialGradient id="base" cx="70%" cy="14%" r="108%">
      <stop offset="0%" stop-color="#1d2824"/>
      <stop offset="34%" stop-color="#14231f"/>
      <stop offset="70%" stop-color="#111e18"/>
      <stop offset="100%" stop-color="#091713"/>
    </radialGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#232c27"/>
      <stop offset="45%" stop-color="#192621"/>
      <stop offset="100%" stop-color="#0f1d19"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#1c2823"/>
      <stop offset="50%" stop-color="#13211c"/>
      <stop offset="100%" stop-color="#0b1915"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#172420"/>
      <stop offset="50%" stop-color="#0f1d18"/>
      <stop offset="100%" stop-color="#071511"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1f2a26"/>
      <stop offset="100%" stop-color="#111f1b"/>
    </linearGradient>
    <filter id="cast" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#030e0a" flood-opacity="0.40"/>
    </filter>
    <filter id="rim" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="weave" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <!-- band D: narrow, tilted, along the top -->
  <g filter="url(#cast)">
    <path fill="url(#bandD)"
          d="M-100 -60H1700V40C1430 150 1240 40 980 105 720 170 420 90 -100 195Z"/>
  </g>
  <path fill="none" stroke="#272e2b" stroke-opacity="0.55" stroke-width="3" filter="url(#rim)"
        d="M1700 40C1430 150 1240 40 980 105 720 170 420 90 -100 195"/>

  <!-- band A: the wide main fold, thick at the left, tapering right -->
  <g filter="url(#cast)">
    <path fill="url(#bandA)"
          d="M-100 300C180 165 430 345 760 255 1090 165 1400 285 1700 205V330C1400 420 1090 320 760 420 430 520 180 400 -100 590Z"/>
  </g>
  <path fill="none" stroke="#292f2c" stroke-opacity="0.5" stroke-width="3.5" filter="url(#rim)"
        d="M-100 300C180 165 430 345 760 255 1090 165 1400 285 1700 205"/>

  <!-- band B: short fold over the left half, running to a point -->
  <g filter="url(#cast)">
    <path fill="url(#bandB)"
          d="M-100 690C200 585 440 725 700 660 860 620 960 640 1080 690 900 700 820 760 640 815 400 888 180 790 -100 860Z"/>
  </g>
  <path fill="none" stroke="#262d2b" stroke-opacity="0.45" stroke-width="3" filter="url(#rim)"
        d="M-100 690C200 585 440 725 700 660 860 620 960 640 1080 690"/>

  <!-- band C: deep, strongly curved band along the bottom -->
  <g filter="url(#cast)">
    <path fill="url(#bandC)"
          d="M-100 905C260 760 520 950 880 885 1180 830 1420 930 1700 845V1060H-100Z"/>
  </g>
  <path fill="none" stroke="#1f2a26" stroke-opacity="0.42" stroke-width="3" filter="url(#rim)"
        d="M-100 905C260 760 520 950 880 885 1180 830 1420 930 1700 845"/>

  <!-- soft pools of light and shade, so the surface is not uniform -->
  <g filter="url(#soft)" opacity="0.4">
    <ellipse cx="1320" cy="140" rx="340" ry="200" fill="#262e2a"/>
    <ellipse cx="120" cy="700" rx="260" ry="230" fill="#05120f"/>
    <ellipse cx="1500" cy="940" rx="300" ry="160" fill="#071410"/>
  </g>

  <rect width="1600" height="1000" filter="url(#weave)"/>
</svg>
